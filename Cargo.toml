[package]
name = "parrot"
version = "1.6.0"
authors = ["aquelemiguel"]
edition = "2024"
rust-version = "1.98"
description = "A Discord music bot built in Rust"
repository = "https://github.com/aquelemiguel/parrot"
license = "MIT"
keywords = ["discord", "music-bot", "rust"]

[dependencies]
dotenvy = "0.15.7"
lazy_static = "1.4.0"
rand = "0.8.5"
regex = "1.5.5"
reqwest = { version = "0.12.24", features = ["rustls-tls", "json", "cookies"], default-features = false }
# rspotify = "0.13"
rspotify = { version = "0.13.3", default-features = false, features = ["client-reqwest", "reqwest-rustls-tls"] }
serde_json = "1.0.79"
url = "2.3.1"
serde = "1.0.152"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing = "0.1.41"
async-trait = "0.1"
futures = "0.3"
# Demuxers for the webm/m4a streams yt-dlp writes to stdout (songbird enables none by default)
symphonia = { version = "0.5.5", default-features = false, features = ["mkv", "isomp4", "aac"] }

[dependencies.songbird]
version = "0.6.0"
features = ["rustls", "driver", "builtin-queue"]

[dependencies.serenity]
version = "0.12"
default-features = false
features = [
  "cache",
  "collector",
  "client",
  "gateway",
  "model",
  "rustls_backend",
  "voice",
]

[dependencies.tokio]
version = "1.17.0"
features = ["macros", "rt-multi-thread"]

