[package]
name = "parrot"
version = "1.6.0"
authors = ["aquelemiguel"]
edition = "2024"
description = "A Discord music bot built in Rust"
repository = "https://github.com/aquelemiguel/parrot"
license = "MIT"
keywords = ["discord", "music-bot", "rust"]

[dependencies]
dotenv = "0.15.0"
lazy_static = "1.4.0"
rand = "0.9.2"
regex = "1.5.5"
serde_json = "1.0.79"
url = "2.3.1"
serde = "1.0.152"
reqwest = { version = "0.12.24", features = ["rustls-tls", "json"], default-features = false }
parking_lot = "0.12.3"
async-trait = "0.1.83"
symphonia = "0.5.4"
audiopus_sys = { version = "0.2.2", features = ["static"] }
dashmap = "6.1.0"
librespot = { version = "0.8.0", features = ["rustls-tls-webpki-roots"], default-features = false }
snafu = { version = "0.8.5", features = ["backtrace"] }
zerocopy = "0.8.5"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing = "0.1.41"
ringbuf-blocking = "0.1.0-rc.3"
ringbuf = "0.4.7"
futures = "0.3.31"
tiny_http = { version = "0.12.0", features = ["rustls", "ssl-rustls"] }
thiserror = "2.0.17"
base64 = "0.22.1"
rcgen = "0.14.5"

[dependencies.rspotify]
version = "0.12.0"
features = ["reqwest-rustls-tls", "__async", "async-stream", "async-trait", "client-reqwest", "futures", "reqwest-rustls-tls"]
default-features = false

[dependencies.songbird]
version = "0.5.0"
features = ["rustls", "driver", "builtin-queue"]

[dependencies.serenity]
version = "0.12.4"
default-features = false
features = ["cache", "collector", "client", "gateway", "model", "rustls_backend", "unstable_discord_api", "voice", "builder"]

[dependencies.tokio]
version = "1.17.0"
features = ["macros", "rt-multi-thread"]

[patch.crates-io]
librespot = { git = "https://github.com/Josh-00FF00/librespot.git" }
